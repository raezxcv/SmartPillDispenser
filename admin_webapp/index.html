<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Pill Dispenser — Admin Portal</title>
  <meta name="description" content="Administrator login portal for Smart Pill Dispenser fleet management system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <!-- Background particles / decorative elements -->
  <div class="bg-decoration">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
  </div>

  <!-- Login Card -->
  <main class="login-container" role="main">
    <div class="login-card glass-card">

      <!-- Logo -->
      <div class="logo-section">
        <div class="logo-wrap">
          <img src="logo.png" alt="Smart Pill Dispenser Logo" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="logo-fallback" style="display:none;">
            <span class="logo-icon">💊</span>
          </div>
        </div>
        <div class="logo-text-group">
          <h1 class="logo-title">Smart Pill Dispenser</h1>
          <span class="logo-badge">Admin Portal</span>
        </div>
      </div>

      <p class="login-subtitle">Sign in to access the admin dashboard</p>

      <!-- Error banner -->
      <div id="error-banner" class="error-banner hidden" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text">Invalid credentials. Please try again.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="admin@smartpill.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            Password
            <button type="button" id="forgot-btn" class="forgot-link">Forgot password?</button>
          </label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" aria-label="Sign In">
          <span class="btn-text">Sign In</span>
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <div class="btn-spinner hidden" aria-hidden="true"></div>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span>Restricted Access</span>
      </div>

      <!-- Security note -->
      <div class="security-note">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>This portal is for authorized administrators only. All access is logged and monitored.</span>
      </div>
    </div>
  </main>

  <!-- Firebase SDK (CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    // ─── Firebase config — replace with your real keys ───────────────────
    const firebaseConfig = {
      apiKey:            "REPLACE_WITH_YOUR_WEB_API_KEY",
      authDomain:        "smart-pill-dispenser-baa02.firebaseapp.com",
      projectId:         "smart-pill-dispenser-baa02",
      storageBucket:     "smart-pill-dispenser-baa02.firebasestorage.app",
      messagingSenderId: "REPLACE_WITH_YOUR_SENDER_ID",
      appId:             "REPLACE_WITH_YOUR_WEB_APP_ID",
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // ─── UI helpers ──────────────────────────────────────────────────────
    const $ = (id) => document.getElementById(id);
    const showError = (msg) => {
      $("error-text").textContent = msg;
      $("error-banner").classList.remove("hidden");
    };
    const hideError = () => $("error-banner").classList.add("hidden");
    const setLoading = (loading) => {
      const btn = $("login-btn");
      btn.disabled = loading;
      btn.querySelector(".btn-text").style.opacity = loading ? "0" : "1";
      btn.querySelector(".btn-icon").style.opacity = loading ? "0" : "1";
      btn.querySelector(".btn-spinner").classList.toggle("hidden", !loading);
    };

    // ─── Auth state — if already logged in, redirect to dashboard ───────
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists() && userDoc.data().role === "admin") {
          window.location.href = "dashboard.html";
        } else if (user) {
          // Signed in but not admin — sign out
          await auth.signOut();
        }
      }
    });

    // ─── Login form submit ────────────────────────────────────────────────
    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      hideError();

      const email    = $("email").value.trim();
      const password = $("password").value;

      if (!email || !password) {
        showError("Please enter your email and password.");
        return;
      }

      setLoading(true);
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const uid  = cred.user.uid;

        // Verify admin role in Firestore
        const userDoc = await getDoc(doc(db, "users", uid));
        if (!userDoc.exists() || userDoc.data().role !== "admin") {
          await auth.signOut();
          showError("Access denied. This portal is for administrators only.");
          setLoading(false);
          return;
        }

        window.location.href = "dashboard.html";
      } catch (err) {
        let msg = "Sign in failed. Please try again.";
        if (err.code === "auth/invalid-credential" ||
            err.code === "auth/wrong-password" ||
            err.code === "auth/user-not-found") {
          msg = "Invalid email or password.";
        } else if (err.code === "auth/too-many-requests") {
          msg = "Too many failed attempts. Please wait and try again.";
        }
        showError(msg);
        setLoading(false);
      }
    });

    // ─── Forgot password ──────────────────────────────────────────────────
    $("forgot-btn").addEventListener("click", async () => {
      const email = $("email").value.trim();
      if (!email || !email.includes("@")) {
        showError("Enter your email address first, then click Forgot password.");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        hideError();
        $("error-banner").style.borderColor = "#10B981";
        $("error-banner").style.backgroundColor = "rgba(16,185,129,0.1)";
        $("error-banner").style.color = "#10B981";
        $("error-banner").classList.remove("hidden");
        $("error-text").textContent = `Password reset email sent to ${email}`;
      } catch {
        showError("Could not send reset email. Check the address and try again.");
      }
    });

    // ─── Toggle password visibility ───────────────────────────────────────
    $("toggle-password").addEventListener("click", () => {
      const input = $("password");
      input.type = input.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
