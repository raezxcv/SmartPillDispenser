name: smart_pill_dispenser
description: Smart Pill Dispenser — Android-first patient & caregiver medication management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^13.2.5
  
  # Firebase
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  firebase_auth: ^5.2.0
  firebase_messaging: ^15.1.0
  firebase_storage: ^12.3.0
  
  # Auth — Social Sign-In
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  
  # Local storage (first-launch detection)
  shared_preferences: ^2.3.2
  
  # Charts & UI
  fl_chart: ^0.66.2
  cached_network_image: ^3.4.0
  intl: ^0.19.0
  permission_handler: ^11.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  uuid: ^4.6.0
  # flutter_webrtc removed temporarily — plugin has compileSdk conflict (API 31 vs 34)
  # Re-add when plugin fixes: https://github.com/flutter-webrtc/flutter-webrtc/issues

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/Smart Pill Dispenser App Logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/Smart Pill Dispenser App Logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/Smart Pill Dispenser Logo.png
    - assets/Smart Pill Dispenser App Logo.png
